name: CI Publish

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version Increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      stage:
        description: 'Release Stage'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # --- JOB 1: Determine Version ---
  prepare_version:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.calc.outputs.version_tag }}
      clean_version: ${{ steps.calc.outputs.clean_version }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: calc
        run: |
          git fetch --tags
          LAST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then LAST_TAG="v0.0.0"; fi
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          INCREMENT="${{ inputs.increment }}"
          if [ "$INCREMENT" == "major" ]; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif [ "$INCREMENT" == "minor" ]; then
            MINOR=$((MINOR+1)); PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "version_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          if [ "${{ inputs.stage }}" == "prerelease" ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  check_wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

  build:
    name: Build Jar
    needs: [check_wrapper, prepare_version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: master
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy CI gradle.properties
        run: |
          cd master
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties \
            ~/.gradle/gradle.properties

      - name: Build Jar
        env:
          ProductBuildType: "Stable"
        working-directory: master
        # Kept downloadWebUI as it is likely a dependency for shadowJar
        run: ./gradlew :server:downloadWebUI :server:shadowJar --stacktrace

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: master/server/build/*.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, prepare_version]
    runs-on: ubuntu-latest
    steps:
      - name: Download Jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: release

      - name: Generate checksums
        run: cd release && sha256sum * > Checksums.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # CHANGE THIS:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prepare_version.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare_version.outputs.is_prerelease }}
          files: release/*
